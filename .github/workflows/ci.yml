name: Release

on:
  push:
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check bash syntax
        run: bash -n entrypoint.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version (without v prefix)
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Get umesh-prep version
        id: umeshprep
        run: echo "version=$(cat .umeshprep-version)" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/umesh-node
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          load: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_TYPE=umeshprep
            UMESHPREP_VERSION=${{ steps.umeshprep.outputs.version }}
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}

      - name: Import GPG signing key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Extract binary from built image
        run: |
          mkdir -p dist
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker create --name binary-extract "$FIRST_TAG"
          docker cp binary-extract:/usr/local/bin/umeshnode dist/umeshnode
          docker cp binary-extract:/usr/local/lib dist/wasmvm-libs
          docker rm -f binary-extract
          chmod +x dist/umeshnode
          WASMVM_SO=$(find dist/wasmvm-libs -type f -name "libwasmvm*.so" ! -name "*.a" | head -1)
          cp "$WASMVM_SO" dist/libwasmvm.x86_64.so
          rm -rf dist/wasmvm-libs
          ARCHIVE="umeshnode-${{ steps.version.outputs.version }}-linux-amd64.tar.gz"
          cd dist
          tar czf "$ARCHIVE" umeshnode libwasmvm.x86_64.so
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Sign release assets
        run: |
          ARCHIVE="umeshnode-${{ steps.version.outputs.version }}-linux-amd64.tar.gz"
          cd dist
          gpg --batch --yes --detach-sign --armor -o "$ARCHIVE.asc" "$ARCHIVE"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/umeshnode-${{ steps.version.outputs.version }}-linux-amd64.tar.gz
            dist/umeshnode-${{ steps.version.outputs.version }}-linux-amd64.tar.gz.sha256
            dist/umeshnode-${{ steps.version.outputs.version }}-linux-amd64.tar.gz.asc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}